<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuenta regresiva</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f0e6; padding: 16px; box-sizing: border-box; }
  </style>
</head>
<body>

<div class="countdown-container" style="text-align: center; font-family: 'Georgia', serif; background: #fdfbf7; padding: 25px; border-radius: 12px; border: 1px solid #d4af37; max-width: 400px; margin: auto; color: #333;">
  <h3 style="color: #5c4033; margin-bottom: 15px; font-size: 1.2rem; letter-spacing: 2px;">FALTA MUY POCO</h3>

  <div id="countdown" style="display: flex; justify-content: space-around; font-size: 1.1rem;">
    <div>
      <span id="days" style="font-size: 1.8rem; font-weight: bold; color: #8b5a2b; display: block;">00</span>
      <span style="font-size: 0.8rem; text-transform: uppercase; color: #666;">Días</span>
    </div>
    <div style="font-size: 1.5rem; color: #d4af37; align-self: center;">:</div>
    <div>
      <span id="hours" style="font-size: 1.8rem; font-weight: bold; color: #8b5a2b; display: block;">00</span>
      <span style="font-size: 0.8rem; text-transform: uppercase; color: #666;">Horas</span>
    </div>
    <div style="font-size: 1.5rem; color: #d4af37; align-self: center;">:</div>
    <div>
      <span id="minutes" style="font-size: 1.8rem; font-weight: bold; color: #8b5a2b; display: block;">00</span>
      <span style="font-size: 0.8rem; text-transform: uppercase; color: #666;">Minutos</span>
    </div>
    <div style="font-size: 1.5rem; color: #d4af37; align-self: center;">:</div>
    <div>
      <span id="seconds" style="font-size: 1.8rem; font-weight: bold; color: #8b5a2b; display: block;">00</span>
      <span style="font-size: 0.8rem; text-transform: uppercase; color: #666;">Segundos</span>
    </div>
  </div>
</div>

<script>
  // Fecha objetivo: 30 de enero de 2027 a las 00:00:00 (hora local)
  const weddingDate = new Date(2027, 0, 30, 0, 0, 0).getTime();

  function updateCountdown() {
    const distance = weddingDate - Date.now();

    if (distance < 0) {
      clearInterval(timer);
      document.getElementById("countdown").innerHTML = "<h4 style='color: #8b5a2b; width: 100%;'>¡Llegó el gran día!</h4>";
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("days").innerText = String(days).padStart(2, '0');
    document.getElementById("hours").innerText = String(hours).padStart(2, '0');
    document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
    document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
  }

  const timer = setInterval(updateCountdown, 1000);
  updateCountdown();
</script>

</body>
</html>
